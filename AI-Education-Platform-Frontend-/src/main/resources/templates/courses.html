<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Courses - LearnSphere</title>
    <link rel="stylesheet" href="/css/dashboard.css">
    <link rel="stylesheet" href="/css/courses.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="nav-content">
            <a href="/home" class="logo" style="text-decoration: none;">Learn</a>
            <a href="/home" class="home-button">
                <i class="fas fa-home"></i> Back to Home
            </a>
            <h class="my-courses">My Courses</h>
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="logout-button" style="border:none;font-size: 16px;font-family: 'Poppins', sans-serif;">Logout</button>
            </form>
            
        </div>
    </nav>

    <div class="content" style="background-color: white;">
        <div class="container">
            <div class="header">
                <h1>Your Courses</h1>
            </div>

            <div th:if="${error}" class="error-message" th:text="${error}">
                Error message here
            </div>

            <div th:if="${courses != null and !courses.empty}" class="courses-grid">
                <div th:each="course : ${courses}" class="course-card">
                    
                    <div class="course-content">
                        <h2 class="course-title" th:text="${course.title}">Course Title</h2>
                        <p class="course-description" th:text="${course.description}">
                            Course description goes here...
                        </p>
                        
                        <div class="course-actions">
                            <a th:href="@{'/course-navigator/' + ${course.id}}" class="view-button" id="course-view-button">
                                <i class="fas fa-eye"></i> View Course
                            </a>
                            <a th:href="@{'/course/raw-navigator/' + ${course.id}}" class="view-button" id="raw-view-button">
                                <i class="fas fa-code"></i> View Raw Data
                            </a>
                        </div>
                    </div>
                </div>
            </div>

            <div th:if="${courses == null or courses.empty}" class="no-courses">
                <i class="fas fa-book-open"></i>
                <h2>No Courses Found</h2>
                <p>You haven't been assigned any courses yet.</p>
            </div>

            <div th:if="${message}" class="message">
                <i class="fas fa-info-circle"></i>
                <h2 th:text="${message}">Message</h2>
                <p>Visit the course selection page to choose your courses.</p>
                <a href="/index" class="view-button">
                    <i class="fas fa-search"></i> Find Courses
                </a>
            </div>
        </div>
    </div>
</body>
</html>
